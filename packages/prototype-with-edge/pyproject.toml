[project]
name = "prototype-with-edge"
version = "0.1.0"
description = "Search PubMed abstracts with Qdrant Edge and OpenRouter embeddings"
readme = "README.md"
authors = [
    { email = "astraberte9@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.16.3",
    "qdrant-edge-py>=0.9.0",
    "tqdm>=4.70.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
prototype-with-edge = "prototype_with_edge:main"
prototype-with-edge-ingest = "prototype_with_edge.ingest:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
