services:
  qdrant:
    image: qdrant/qdrant:v1.20.1
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: packages/self-hosted-qdrant/Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file: ../../.env
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_storage:
